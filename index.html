<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>မြန်မာစာ စီစဉ်ရန်</title>
</head>
<body>
    <div id="container">
        <h1>မြန်မာစာအက္ခရာ စီစဉ်ရန်</h1>
        <div id="display">
            <div id="btn">
                <input type="text" id="wordsInput" autocomplete="on">
                <input type="button" onclick="arrangeWords()" value="ထည့်ပါ">
            </div>

            <h3>စီစဉ်ရန်</h3>
            <div id="beforeArrange"></div>

            <h3>စီစဉ်ပြီး <span>(ဖျက်လိုသည်ကိုနှိပ်၍ဖျက်နိုင်သည်။)</span></h3>
            <ul id="afterArrange"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
