<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Arrange Words</title>
</head>
<body>
    <div id="container">
        <h1>Arrange Words</h1>
        <div id="display">
            <input type="text" id="wordsInput">
            <input type="button" onclick="arrangeWords()" value="Add">

            <h3>After Arrange</h3>
            <ul id="afterArrange"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
